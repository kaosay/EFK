services:
    setup:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        user: '0'
        command: >
          bash -c '
            if [ x${ELASTIC_PASSWORD} == x ]; then
              echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
              exit 1;
            elif [ x${KIBANA_PASSWORD} == x ]; then
              echo "Set the KIBANA_PASSWORD environment variable in the .env file";
              exit 1;
            fi;
    
            # 修复权限（保持不变）
            chown -R 1000:0 /usr/share/elasticsearch/data;
            sync;
            find /usr/share/elasticsearch -type d -exec chmod 0750 {} \;;
            find /usr/share/elasticsearch -type f -exec chmod 0640 {} \;;
    
            # 等待 ES 启动（使用 HTTP）
            echo "Waiting for Elasticsearch availability";
            until curl -s http://elasticsearch:9200 | grep -q "missing authentication credentials"; do
              sleep 30;
            done;
    
            # 设置 kibana_system 密码（使用 HTTP）
            echo "Setting kibana_system password";
            until curl -s -X POST -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" \
              http://elasticsearch:9200/_security/user/kibana_system/_password \
              -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do
              sleep 10;
            done;
    
            echo "All done!";
          '
        healthcheck:
          test: ["CMD-SHELL", "[ -f /usr/share/elasticsearch/data/.initialized ] || exit 1"]
          interval: 10s
          timeout: 5s
          retries: 30
    elasticsearch:
        depends_on:
          setup:
            condition: service_healthy
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        container_name: elasticsearch
        restart: unless-stopped
        mem_limit: 4g
        cpus: 2
        environment:
          - discovery.type=single-node                  # single-node cluster
          - xpack.security.enabled=true                 # disable password security
          - xpack.security.http.ssl.enabled=false       # disable tls/ssl encryption
          - xpack.security.transport.ssl.enabled=false  # disable tls/ssl encryption
          - "ES_JAVA_OPTS=-Xms3g -Xmx3g"
          - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}        # 设置 elasticsearch 用户的密码
        ports:
          - 9200:9200
        volumes:
          # sudo chown -R 1000:1000 ./elasticsearch
          - ./elasticsearch:/usr/share/elasticsearch/data
        networks:
          - local

        healthcheck:
          test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
          interval: 10s
          timeout: 10s
          retries: 120
    kibana:
        depends_on:
          elasticsearch:
            condition: service_healthy
        image: docker.elastic.co/kibana/kibana:8.13.4
        container_name: kibana
        restart: unless-stopped
        mem_limit: 1g
        cpus: 1
        environment:
          - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
          - SERVER_HEAP_SIZE=512mm
          - DISABLE_OBSERVABILITY=true  # 禁用 Observability 插件
          - ELASTICSEARCH_USERNAME=kibana  # 设置 Kibana 使用的 Elasticsearch 用户名
          - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD} # 设置 Kibana 的密码，需与 Elasticsearch 密码匹配
          - NODE_OPTIONS=--openssl-legacy-provider
        ports:
          - 5601:5601
        networks:
          - local
        depends_on:
          - fluent-bit
          - elasticsearch
    fluent-bit:
        image: fluent/fluent-bit:4.0
        container_name: fluent-bit
        mem_limit: 1g
        cpus: 1
        restart: unless-stopped
        command:
          - /fluent-bit/bin/fluent-bit
          - --config=/etc/fluent-bit/fluent-bit.conf
        environment:
          - FLB_ES_HOST=elasticsearch
          - FLB_ES_PORT=9200
          - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
        ports:
          #- 2020:2020
          - 24224:24224
        volumes:
          - ./conf/:/etc/fluent-bit/:ro
          - /igs-server:/igs-server
          - ./fluent-bit:/var/log/fluent-bit
        networks:
          - local

networks:
  local:
    driver: bridge
