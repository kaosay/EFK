[SERVICE]
    flush        2
    daemon       off
    http_server  on
    log_level    info
    parsers_file parsers.conf

    Storage.type filesystem
    Storage.path /var/log/fluent-bit/
    Storage.sync normal
    Storage.backlog.mem_limit 150M
    Storage.Max_Chunks_up 128
    Mem_Buf_Limit 200MB

# 接收 Docker 容器日志（可选）
[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224

# -----------------------
# 采集业务日志（文本/混合日志）
# -----------------------

# igs log
[INPUT]
    Name          tail
    Path          /igs-server/log/*.log
    Tag           prod.log
    DB                /var/log/fluent-bit/igslog.db
    Read_from_Head True
    Path_key filename
    Parser        plain_text
    Mem_Buf_Limit 100MB

# igs nolog
[INPUT]
    Name          tail
    Path          /igs-server/nolog/ser-*.log
    Tag           prod.nolog
    DB            /var/log/fluent-bit/igs-nolog.db
    Read_from_Head True
    Path_key filename
    Parser        plain_text
    Mem_Buf_Limit 100MB

# -----------------------
# 输出到 Elasticsearch
# -----------------------
[OUTPUT]
    Name            es
    Match           *
    Host            ${FLB_ES_HOST}
    Port            ${FLB_ES_PORT}
    Index           fozo-logs
    Logstash_Format Off
    Retry_Limit     False
    Suppress_Type_Name On       
    Include_Tag_Key    On
    Tag_Key            tag
    Http_User elastic
    Http_Passwd Qy3uacBChz82ErxlHMzE
    Buffer_Size       11MB          # 减小单次 flush 大小
    compress gzip
